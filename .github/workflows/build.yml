name: Build BunMod 1.13.2

on:
  workflow_dispatch:
  push:
    branches:
      - mc-1.13.2

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle-4.9-bin.zip
          echo "$PWD/gradle-4.9/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: gradle --version

      - name: Build mod
        run: gradle --no-daemon build

      - name: Show build output
        run: ls -la build/libs

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: BunMod-1.13.2
          path: build/libs/*.jar
