name: Build Minecraft 1.13.2 Mod

on:
  push:
    branches:
      - minecraft-1.13.2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.9'

      - name: Build
        run: gradle --no-daemon build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Bunmod-1.13.2
          path: build/libs/*.jar
