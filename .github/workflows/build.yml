name: Build BunMod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Скачать исходники
        uses: actions/checkout@v4

      - name: Установить Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Собрать мод
        run: chmod +x gradlew && ./gradlew build

      - name: Загрузить готовый JAR
        uses: actions/upload-artifact@v4
        with:
          name: BunMod-1.12.2
          path: build/libs/*.jar
