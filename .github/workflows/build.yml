name: Build Minecraft 1.13.2 Mod

on:
  push:
    branches:
      - mc-1.13.2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.9'

      - name: Show project files
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Java:"
          java -version
          echo "Gradle:"
          gradle --version
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Build Forge mod
        run: gradle --no-daemon --stacktrace build

      - name: List build output
        if: always()
        run: |
          echo "Build output:"
          find build -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bunmod-1.13.2
          path: build/libs/*.jar
          if-no-files-found: error
